name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # checks.module is a NixOS VM test; GitHub's Linux runners have KVM,
      # it only needs opening up.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      # Fallback, only if the VM test fails twice on main with no code cause
      # (plan/2026-09-24-11-ci-hygiene.md): replace this step with
      #   nix flake check -L --no-build
      #   nix build -L .#checks.x86_64-linux.{shellcheck,cli,manifest,no-hardcoded-colours,module-gating}
      # and run checks.module by hand before a release.
      - name: nix flake check
        run: nix flake check -L
